name = "koin-netplay-signaling"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# Public demo default — lock this down to your actual site(s) before
# deploying for real use, e.g. "https://yourgame.com,https://yourgame.dev".
[vars]
ALLOWED_ORIGINS = "*"

[[durable_objects.bindings]]
name = "SIGNALING_ROOM"
class_name = "SignalingRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SignalingRoom"]

# TURN credentials are optional — without them this server still works for
# signaling, and koin.js/netplay falls back to STUN-only (peers behind
# strict NATs may fail to connect; see the plan's cost model). To enable:
#   wrangler secret put CF_TURN_KEY_ID
#   wrangler secret put CF_TURN_API_TOKEN
# (Create a TURN key at https://developers.cloudflare.com/realtime/turn/ first.)

# Access control is optional. Without it, anyone with a room code can join
# (fine for a public demo). A site with accounts should set a secret and
# have its backend mint join tokens (src/join-token.ts documents the format;
# signJoinToken() mints them from any JS runtime):
#   wrangler secret put JOIN_TOKEN_SECRET
# Then every signaling connection and /turn-credentials request must carry
# a valid token.
